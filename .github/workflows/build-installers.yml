name: Build Installers

on:
  push:
    branches: [test, main, master]
  pull_request:
    branches: [test, main, master]
  workflow_dispatch:  # Manual trigger

jobs:
  build-macos:
    name: Build macOS App
    runs-on: macos-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        working-directory: screentime_agent
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-build.txt
      
      - name: Build macOS app
        working-directory: screentime_agent
        run: |
          python -m PyInstaller screentime_agent.spec --noconfirm
      
      - name: Create DMG
        working-directory: screentime_agent
        run: |
          hdiutil create -volname "ScreenTimeAgent" \
            -srcfolder "dist/ScreenTimeAgent.app" \
            -ov -format UDZO \
            "dist/ScreenTimeAgent-macOS.dmg"
      
      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: ScreenTimeAgent-macOS
          path: screentime_agent/dist/ScreenTimeAgent-macOS.dmg

  build-windows:
    name: Build Windows Exe
    runs-on: windows-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        working-directory: screentime_agent
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-build.txt
      
      - name: Build Windows exe
        working-directory: screentime_agent
        run: |
          python -m PyInstaller screentime_agent.spec --noconfirm
      
      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: ScreenTimeAgent-Windows
          path: screentime_agent/dist/ScreenTimeAgent.exe

  release:
    name: Create Release
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && contains(github.ref, 'refs/tags/')
    
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            artifacts/ScreenTimeAgent-macOS/ScreenTimeAgent-macOS.dmg
            artifacts/ScreenTimeAgent-Windows/ScreenTimeAgent.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
